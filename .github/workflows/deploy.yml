name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches: [ main ] # ブランチ名が master の場合は master に変更

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 出力先を ./output に明示指定
      - name: Publish App
        run: dotnet publish QOL_Upper_App.csproj -c Release -o output --nologo

      # Jekyll処理を無効化するファイルを wwwroot 内に作成
      - name: Add .nojekyll file
        run: touch output/wwwroot/.nojekyll

      # output/wwwroot の中身だけをデプロイ対象としてアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
